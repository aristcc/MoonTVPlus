name: Sync upstream automatically

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 */3 * *"

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.prepare.outputs.has_changes }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      upstream_sha: ${{ steps.prepare.outputs.upstream_sha }}
      upstream_short: ${{ steps.prepare.outputs.upstream_short }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare upstream and fork
        id: prepare
        env:
          UPSTREAM_REPO: mtvpls/MoonTVPlus
          UPSTREAM_BRANCH: main
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch origin main
          git fetch upstream "${UPSTREAM_BRANCH}"

          base_sha="$(git rev-parse origin/main)"
          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          upstream_short="$(git rev-parse --short "upstream/${UPSTREAM_BRANCH}")"

          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          echo "upstream_short=${upstream_short}" >> "$GITHUB_OUTPUT"

          if ! git show "${base_sha}:.dockerignore" | grep -qxF '.git'; then
            echo "::error::The fork .dockerignore must keep the .git exclusion."
            exit 1
          fi
          if git show "${base_sha}:.dockerignore" | grep -Eq '^[[:space:]]*!'; then
            echo "::error::Negated Docker ignore rules are not allowed; they may re-include .git metadata."
            exit 1
          fi

          for ignore_file in Dockerfile.dockerignore Dockerfile.lite.dockerignore; do
            if git cat-file -e "${base_sha}:${ignore_file}" 2>/dev/null || git cat-file -e "${upstream_sha}:${ignore_file}" 2>/dev/null; then
              echo "::error::${ignore_file} overrides the root .dockerignore; review its build-context rules before syncing."
              exit 1
            fi
          done

          # The fork owns .dockerignore to keep Git metadata out of Docker contexts.
          base_dockerignore="$(git show "${base_sha}:.dockerignore" | sed '/^\.git$/d')"
          upstream_dockerignore="$(git show "${upstream_sha}:.dockerignore" | sed '/^\.git$/d')"
          if [[ "${base_dockerignore}" != "${upstream_dockerignore}" ]]; then
            echo "::error::Upstream changed .dockerignore beyond the fork's .git exclusion; review and merge that change before syncing."
            exit 1
          fi

          if git diff --quiet "${base_sha}" "${upstream_sha}" -- . ':!.github/workflows/**' ':!.dockerignore'; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Fork is already up to date with upstream ${upstream_short}."
            exit 0
          fi

          git diff --binary "${base_sha}" "${upstream_sha}" -- . ':!.github/workflows/**' ':!.dockerignore' > "$RUNNER_TEMP/upstream.patch"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Save update patch
        if: steps.prepare.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-patch
          path: ${{ runner.temp }}/upstream.patch
          retention-days: 1

  validate:
    if: needs.prepare.outputs.has_changes == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the exact fork revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download update patch
        uses: actions/download-artifact@v4
        with:
          name: upstream-sync-patch
          path: upstream-sync-patch

      - name: Apply upstream changes
        run: git apply --index --3way upstream-sync-patch/upstream.patch

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test --passWithNoTests

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Build for Vercel
        run: pnpm build

  publish:
    if: needs.prepare.outputs.has_changes == 'true' && needs.validate.result == 'success'
    needs:
      - prepare
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout the exact fork revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0

      - name: Download update patch
        uses: actions/download-artifact@v4
        with:
          name: upstream-sync-patch
          path: upstream-sync-patch

      - name: Publish validated update to main
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          UPSTREAM_SHORT: ${{ needs.prepare.outputs.upstream_short }}
        run: |
          set -euo pipefail

          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [[ "${current_main}" != "${BASE_SHA}" ]]; then
            echo "main moved while the upstream update was being validated; aborting safely"
            exit 1
          fi

          git apply --index --3way upstream-sync-patch/upstream.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync MoonTVPlus to upstream ${UPSTREAM_SHORT}"
          git push origin HEAD:main

      - name: Trigger the updated container image build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker-image.yml --repo "${GITHUB_REPOSITORY}" --ref main --field tag=latest
