name: Retire the Cloudflare copy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the exact Worker removal; set false to remove it"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install the repository's pinned Wrangler version
        run: npm install --global wrangler@4.60.0

      - name: Verify the target and retire the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          EXPECTED_VERSION_ID: bebc9eb1-a1b3-4772-bac2-05cd5e595413
        run: |
          set -euo pipefail

          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"

          identity="$(wrangler whoami)"
          printf '%s' "${identity}" | grep -F "${CLOUDFLARE_ACCOUNT_ID}" >/dev/null
          echo "Authenticated Cloudflare account matches the deployment secret."

          versions="$(wrangler versions list --name moontv-plus)"
          printf '%s' "${versions}" | grep -F "${EXPECTED_VERSION_ID}" >/dev/null
          echo "Found the recorded MoonTV Plus Worker deployment."

          if [[ "${DRY_RUN}" == "true" ]]; then
            wrangler delete --name moontv-plus --dry-run
            echo "Dry run only; the Worker is unchanged."
            exit 0
          fi

          wrangler delete --name moontv-plus --force

          if wrangler deployments list --name moontv-plus > "$RUNNER_TEMP/remaining-worker.txt" 2>&1; then
            echo "The Worker still exists after the delete command."
            cat "$RUNNER_TEMP/remaining-worker.txt"
            exit 1
          fi

          if ! grep -Eiq '10007|not found' "$RUNNER_TEMP/remaining-worker.txt"; then
            echo "Could not confirm that the Worker is gone."
            cat "$RUNNER_TEMP/remaining-worker.txt"
            exit 1
          fi

          echo "Confirmed that the Cloudflare Worker no longer exists."
